name: Release

# Publishing is tag-driven: a v* tag is the only thing that can create a
# GitHub Release. The build job still runs on every push to main, but it never
# uploads binaries.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gradle's daemon JVM is 21 even though compileOptions stays on 11.
      # Matching it here avoids a toolchain download on every release.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify tag matches version.properties
        run: |
          python3 - <<'PY'
          import pathlib, os, sys
          values = {}
          for line in pathlib.Path("version.properties").read_text(encoding="utf-8").splitlines():
              line = line.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              values[key.strip()] = value.strip()
          version = ".".join(values[k] for k in ("VERSION_MAJOR", "VERSION_MINOR", "VERSION_PATCH"))
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              print(f"tag {tag} does not match version.properties v{version}", file=sys.stderr)
              sys.exit(1)
          print(f"tag and version agree: {tag}")
          PY

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ALBUM_STORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ALBUM_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALBUM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALBUM_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured in repository secrets"
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ALBUM_STORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/album-release.jks"
          test -s "$RUNNER_TEMP/album-release.jks"

      - name: Build signed release APKs
        env:
          ORG_GRADLE_PROJECT_ALBUM_STORE_FILE: ${{ runner.temp }}/album-release.jks
          ORG_GRADLE_PROJECT_ALBUM_STORE_PASSWORD: ${{ secrets.ALBUM_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ALBUM_KEY_ALIAS: ${{ secrets.ALBUM_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ALBUM_KEY_PASSWORD: ${{ secrets.ALBUM_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --stacktrace

      - name: Verify all ABI APKs carry the repository version
        run: python3 scripts/check_apk_version.py --all

      - name: Extract release notes from CHANGELOG
        run: python3 scripts/extract-release-notes.py > release-notes.md

      - name: Generate update manifest and SHA-256 list
        shell: pwsh
        run: |
          $notes = Get-Content -LiteralPath release-notes.md -Raw
          & ./scripts/write-update-manifest.ps1 -Notes $notes
          Get-Content -LiteralPath app/release/SHA256SUMS

      - name: Verify manifest and checksums
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          values = {}
          for line in pathlib.Path("version.properties").read_text(encoding="utf-8").splitlines():
              line = line.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              values[key.strip()] = value.strip()
          version_name = ".".join(values[k] for k in ("VERSION_MAJOR", "VERSION_MINOR", "VERSION_PATCH"))
          version_code = int(values["VERSION_CODE"])
          root = pathlib.Path("app/build/outputs/apk/release")
          manifest = json.loads(pathlib.Path("app/release/album-update.json").read_text(encoding="utf-8"))
          assert manifest["versionCode"] == version_code, manifest["versionCode"]
          assert manifest["versionName"] == version_name, manifest["versionName"]
          assert f"/releases/tag/v{version_name}" in manifest["downloadUrl"], manifest["downloadUrl"]
          for abi, expected in manifest["sha256"].items():
              apk = root / f"app-{abi}-release.apk"
              actual = hashlib.sha256(apk.read_bytes()).hexdigest()
              assert actual == expected, (abi, actual, expected)
          print("manifest and SHA-256 checks passed for", ", ".join(sorted(manifest["sha256"])))
          PY

      - name: Upload release mapping
        uses: actions/upload-artifact@v4
        with:
          name: album-mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Album ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            app/build/outputs/apk/release/app-x86_64-release.apk
            app/release/album-update.json
            app/release/SHA256SUMS
          fail_on_unmatched_files: true
          make_latest: true
